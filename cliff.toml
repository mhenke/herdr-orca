# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
            {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/mhenke/herdr-orca/pull/{{ commit.remote.pr_number }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/mhenke/herdr-orca/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/mhenke/herdr-orca/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous and release.previous.version -%}
            [unreleased]: https://github.com/mhenke/herdr-orca/compare/{{ release.previous.version }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(update|small updates|small update)$", skip = true },
    { message = "^feat(\\((.*)\\))?:", group = "Features" },
    { message = "^fix(\\((.*)\\))?:", group = "Bug Fixes" },
    { message = "^doc(s)?(\\((.*)\\))?:", group = "Documentation" },
    { message = "^perf(\\((.*)\\))?:", group = "Performance" },
    { message = "^refactor(\\((.*)\\))?:", group = "Refactoring" },
    { message = "^style(\\((.*)\\))?:", group = "Styling" },
    { message = "^test(\\((.*)\\))?:", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    # Catch informal commit styles across repo history:
    { message = "^(AGENTS\\.md|Docs|docs|Plan|Spec|Install graphify):", group = "Documentation" },
    { message = "^(preview(\\.png)?|theme|icons?):", group = "Styling" },
    { message = "^(orca-[a-z/\\-]+|Projects|landing|Refresh):", group = "Features" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"


