name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript syntax
        run: |
          for f in mods/*/main.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Generate release notes
        run: |
          uvx git-cliff --tag ${{ github.ref_name }} --latest --strip header > RELEASE_NOTES.md

      - name: Package layout archive
        run: |
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"
          ARCHIVE_BASE="herdr-orca-${{ github.ref_name }}"
          tar -czf "$DIST_DIR/${ARCHIVE_BASE}.tar.gz" \
            layouts/ mods/ extras/ keys.json scripts/sync.sh README.md RECIPE.md CHANGELOG.md
          zip -rq "$DIST_DIR/${ARCHIVE_BASE}.zip" \
            layouts/ mods/ extras/ keys.json scripts/sync.sh README.md RECIPE.md CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
